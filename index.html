<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רישום לשיעור פרטני — היסטוריה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: #F9FAFB;
      color: #111111;
      min-height: 100vh;
      direction: rtl;
    }

    .page-header {
      background: #ffffff;
      border-bottom: 3px solid #0891B2;
      padding: 32px 24px 24px;
      text-align: center;
    }
    .page-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #111111;
      line-height: 1.2;
    }
    .page-header p {
      margin-top: 8px;
      font-size: 1.05rem;
      color: #555;
    }

    /* ===== COUNTDOWN ===== */
    #countdown-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .countdown-label {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 24px;
    }
    .countdown-digits {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      direction: ltr;
    }
    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cd-num {
      background: #0891B2;
      color: #fff;
      font-size: 3rem;
      font-weight: 800;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .cd-label {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #777;
    }
    .cd-sep {
      font-size: 2.5rem;
      font-weight: 800;
      color: #0891B2;
      margin-bottom: 20px;
    }
    .open-date-note {
      margin-top: 28px;
      font-size: 0.95rem;
      color: #888;
    }

    /* ===== FORM SECTION ===== */
    #form-section {
      display: none;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px 64px;
    }

    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #E0F2FE;
      border-radius: 8px;
      font-family: 'Heebo', sans-serif;
      font-size: 1rem;
      color: #111;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }
    .form-group input:focus {
      border-color: #0891B2;
    }

    .slots-title {
      font-weight: 800;
      font-size: 1rem;
      color: #111;
      margin: 28px 0 16px;
    }

    .day-group {
      margin-bottom: 20px;
    }
    .day-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #0891B2;
      margin-bottom: 10px;
    }
    .slots-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .slot-btn {
      padding: 12px 22px;
      min-height: 48px;
      border: 2px solid #0891B2;
      border-radius: 8px;
      background: #fff;
      color: #0891B2;
      font-family: 'Heebo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      touch-action: manipulation;
    }
    .slot-btn:hover {
      background: #E0F2FE;
    }
    .slot-btn.selected {
      background: #0891B2;
      color: #fff;
    }
    .slot-btn.full {
      display: none;
    }
    .slot-remaining {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 2px;
    }
    .slot-btn.selected .slot-remaining {
      opacity: 0.9;
    }

    .no-slots-msg {
      color: #e53e3e;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .submit-btn {
      margin-top: 28px;
      width: 100%;
      padding: 16px;
      min-height: 52px;
      background: #0891B2;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Heebo', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn:hover:not(:disabled) {
      background: #0e7490;
    }
    .submit-btn:disabled {
      background: #9CA3AF;
      cursor: not-allowed;
    }

    .loading-slots {
      color: #888;
      font-size: 0.9rem;
      margin: 12px 0;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* ===== SUCCESS ===== */
    #success-section {
      display: none;
      max-width: 480px;
      margin: 80px auto;
      padding: 0 16px;
      text-align: center;
    }
    .success-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .success-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .success-card h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0891B2;
      margin-bottom: 12px;
    }
    .success-card p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
    }
    .success-slot-info {
      margin-top: 20px;
      background: #E0F2FE;
      border-radius: 10px;
      padding: 14px 20px;
      font-weight: 700;
      color: #0891B2;
      font-size: 1.1rem;
    }

    @media (max-width: 520px) {
      .page-header { padding: 20px 16px 16px; }
      .page-header h1 { font-size: 1.4rem; }
      .page-header p { font-size: 0.95rem; }

      #countdown-section { padding: 40px 16px; }
      .cd-num { width: 68px; height: 68px; font-size: 2rem; border-radius: 8px; }
      .cd-sep { font-size: 2rem; }
      .cd-label { font-size: 0.78rem; }
      .open-date-note { font-size: 0.85rem; }

      #form-section { margin: 24px auto; }
      .form-card { padding: 20px 14px; border-radius: 12px; }

      .slots-grid { display: grid; grid-template-columns: 1fr 1fr; }
      .slot-btn { width: 100%; text-align: center; }

      #success-section { margin: 40px auto; }
      .success-card { padding: 32px 20px; }
      .success-card h2 { font-size: 1.5rem; }
    }

    @media (max-width: 360px) {
      .cd-num { width: 58px; height: 58px; font-size: 1.7rem; }
      .cd-sep { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>רישום לשיעור פרטני</h1>
  <p>היסטוריה עם יעקב — בגרות קיץ תשפ"ו</p>
</div>

<!-- ===== COUNTDOWN ===== -->
<div id="countdown-section">
  <div class="countdown-label">הרישום יפתח בעוד</div>
  <div class="countdown-digits">
    <div class="cd-unit">
      <div class="cd-num" id="cd-hours">00</div>
      <div class="cd-label">שעות</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-num" id="cd-minutes">00</div>
      <div class="cd-label">דקות</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-num" id="cd-seconds">00</div>
      <div class="cd-label">שניות</div>
    </div>
  </div>
  <div class="open-date-note">שישי 9 במאי 2026 • 21:00</div>
</div>

<!-- ===== FORM ===== -->
<div id="form-section">
  <div class="form-card">
    <div class="form-group">
      <label for="firstName">שם פרטי</label>
      <input type="text" id="firstName" placeholder="שם פרטי" autocomplete="given-name">
    </div>
    <div class="form-group">
      <label for="lastName">שם משפחה</label>
      <input type="text" id="lastName" placeholder="שם משפחה" autocomplete="family-name">
    </div>

    <div class="slots-title">בחר שעה לשיעור הפרטני</div>
    <div id="slots-loading" class="loading-slots">טוען זמינות שעות...</div>

    <div id="slots-container" style="display:none">
      <div class="day-group">
        <div class="day-label">יום ראשון — 10 במאי</div>
        <div class="slots-grid" id="slots-rishon"></div>
      </div>
      <div class="day-group">
        <div class="day-label">יום שני — 11 במאי</div>
        <div class="slots-grid" id="slots-sheni"></div>
      </div>
      <div id="no-slots-msg" class="no-slots-msg" style="display:none">
        כל השעות מלאות. אנא פנה ליעקב ישירות.
      </div>
    </div>

    <div id="form-error" class="error-msg" style="display:none"></div>
    <button class="submit-btn" id="submit-btn" disabled onclick="submitForm()">שמור מקום</button>
  </div>
</div>

<!-- ===== SUCCESS ===== -->
<div id="success-section">
  <div class="success-card">
    <div class="success-icon">✓</div>
    <h2>נרשמת בהצלחה!</h2>
    <p id="success-name"></p>
    <div class="success-slot-info" id="success-slot"></div>
    <p style="margin-top:16px; color:#888; font-size:0.9rem;">תהיה/י נוכח/ת בזמן. בהצלחה בבגרות!</p>
  </div>
</div>

<iframe name="submit-target" style="display:none"></iframe>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFDlBHn07-bzcBGhok5pVsrFsQcvwspYEf8DF8toXFzog-qhkerIbNc361-Xij3W2VAg/exec';
  var OPEN_TIME = new Date('2020-01-01T00:00:00Z'); // TEST MODE
  var MAX_PER_SLOT = 3;

  var SLOTS = {
    rishon: [
      { day: 'ראשון', time: '09:10' },
      { day: 'ראשון', time: '10:00' },
      { day: 'ראשון', time: '10:40' },
      { day: 'ראשון', time: '11:40' }
    ],
    sheni: [
      { day: 'שני', time: '09:10' },
      { day: 'שני', time: '10:00' },
      { day: 'שני', time: '10:40' },
      { day: 'שני', time: '11:40' }
    ]
  };

  var selectedSlot = null;
  var slotCounts = {};
  var refreshTimer = null;

  // ===== COUNTDOWN =====
  function updateCountdown() {
    var now = new Date();
    var diff = OPEN_TIME - now;

    if (diff <= 0) {
      clearInterval(countdownInterval);
      document.getElementById('countdown-section').style.display = 'none';
      openForm();
      return;
    }

    var hours   = Math.floor(diff / 3600000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    var seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById('cd-hours').textContent   = String(hours).padStart(2,'0');
    document.getElementById('cd-minutes').textContent = String(minutes).padStart(2,'0');
    document.getElementById('cd-seconds').textContent = String(seconds).padStart(2,'0');
  }

  var countdownInterval = setInterval(updateCountdown, 1000);
  updateCountdown();

  // ===== OPEN FORM =====
  function openForm() {
    document.getElementById('form-section').style.display = 'block';
    loadSlots();
    refreshTimer = setInterval(loadSlots, 30000);
  }

  // ===== LOAD SLOTS VIA JSONP =====
  function loadSlots() {
    var cbName = 'slotsCb_' + Date.now();
    var script = document.createElement('script');
    script.src = APPS_SCRIPT_URL + '?sheetName=' + encodeURIComponent('פרטני') + '&callback=' + cbName;
    script.onerror = function() {
      document.getElementById('slots-loading').textContent = 'שגיאה בטעינת זמינות. מנסה שוב...';
      document.body.removeChild(script);
    };
    window[cbName] = function(data) {
      document.body.removeChild(script);
      delete window[cbName];
      processSlots(data);
    };
    document.body.appendChild(script);
  }

  function processSlots(data) {
    slotCounts = {};
    var rows = data.slice(1);
    rows.forEach(function(row) {
      if (row[3] && row[4]) {
        var key = row[3] + '-' + row[4];
        slotCounts[key] = (slotCounts[key] || 0) + 1;
      }
    });
    renderSlots();
  }

  function renderSlots() {
    document.getElementById('slots-loading').style.display = 'none';
    document.getElementById('slots-container').style.display = 'block';

    renderDaySlots('slots-rishon', SLOTS.rishon);
    renderDaySlots('slots-sheni', SLOTS.sheni);

    var anyVisible = document.querySelectorAll('.slot-btn:not(.full)').length > 0;
    document.getElementById('no-slots-msg').style.display = anyVisible ? 'none' : 'block';

    updateSubmitBtn();
  }

  function renderDaySlots(containerId, slots) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    slots.forEach(function(slot) {
      var key = slot.day + '-' + slot.time;
      var count = slotCounts[key] || 0;
      var isFull = count >= MAX_PER_SLOT;

      var remaining = MAX_PER_SLOT - count;
      var btn = document.createElement('button');
      btn.className = 'slot-btn' + (isFull ? ' full' : '') + (selectedSlot && selectedSlot.key === key ? ' selected' : '');
      btn.innerHTML = slot.time + '<span class="slot-remaining">' + remaining + ' פנויים</span>';
      btn.dataset.day  = slot.day;
      btn.dataset.time = slot.time;
      btn.dataset.key  = key;

      if (!isFull) {
        btn.addEventListener('click', function() { selectSlot(this); });
      }
      container.appendChild(btn);
    });
  }

  function selectSlot(btn) {
    document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
    selectedSlot = { day: btn.dataset.day, time: btn.dataset.time, key: btn.dataset.key };
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    document.getElementById('submit-btn').disabled = !selectedSlot;
  }

  // ===== SUBMIT =====
  function submitForm() {
    var firstName = document.getElementById('firstName').value.trim();
    var lastName  = document.getElementById('lastName').value.trim();
    var errEl = document.getElementById('form-error');

    errEl.style.display = 'none';
    if (!firstName || !lastName) {
      errEl.textContent = 'יש למלא שם פרטי ושם משפחה.';
      errEl.style.display = 'block';
      return;
    }
    if (!selectedSlot) {
      errEl.textContent = 'יש לבחור שעה.';
      errEl.style.display = 'block';
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'שולח...';

    if (refreshTimer) clearInterval(refreshTimer);

    var fields = {
      sheetName: 'פרטני',
      timestamp: new Date().toLocaleString('he-IL'),
      firstName: firstName,
      lastName:  lastName,
      day:       selectedSlot.day,
      time:      selectedSlot.time
    };

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = 'submit-target';

    Object.entries(fields).forEach(function(entry) {
      var input = document.createElement('input');
      input.type  = 'hidden';
      input.name  = entry[0];
      input.value = entry[1];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);

    setTimeout(function() {
      showSuccess(firstName, lastName);
    }, 2500);
  }

  function showSuccess(firstName, lastName) {
    document.getElementById('form-section').style.display = 'none';
    var sec = document.getElementById('success-section');
    sec.style.display = 'block';
    document.getElementById('success-name').textContent = firstName + ' ' + lastName + ', השיעור שלך נרשם.';
    var dayLabel = selectedSlot.day === 'ראשון' ? 'יום ראשון 10 במאי' : 'יום שני 11 במאי';
    document.getElementById('success-slot').textContent = dayLabel + ' — ' + selectedSlot.time;
  }
</script>
</body>
</html>
